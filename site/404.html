<!doctype html>

<head>

<title>Not found — photon</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/img/icon.svg" type="image/svg+xml">
<style>
  /* The app's own tokens, as in index.html; tokens.rs's tests hold every page to them. */
  :root {
    color-scheme: light dark;
    --surface: #ffffff;
    --text: #1f1f23;
    --text-dim: #5f5f67;
    --accent: #1f6fd6;
  }
  /* Dark by the system's setting, unless the visitor chose light, and dark by their choice
     (theme.js): one palette twice, which tokens.rs's tests hold to be the same. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1b1b1e;
      --text: #ededf0;
      --text-dim: #a6a6af;
      --accent: #62a0ea;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #1b1b1e;
    --text: #ededf0;
    --text-dim: #a6a6af;
    --accent: #62a0ea;
  }
  :root[data-theme="light"] { color-scheme: light; }
  /* Served from the site, as on every page: SIL OFL 1.1, /fonts/geist-OFL.txt. Absolute,
     as this page answers at any path. */
  @font-face { font-family: Geist; src: url(/fonts/geist.woff2) format("woff2"); font-weight: 100 900; font-display: swap; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text);
    font: 16px/1.6 Geist, system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  main { max-width: 30rem; margin: 0 auto; padding: 6rem 1rem; text-align: center; }
  img { width: 72px; height: 72px; }
  h1 { font-size: 1.75rem; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; margin: .5rem 0; }
  p { color: var(--text-dim); }
  a { color: var(--accent); text-underline-offset: 2px; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
</style>
<script src="/theme.js"></script>
</head>
<body>
<main>

</main>
</body>
