[workspace]
resolver = "3"
members = ["crates/photon-core", "crates/photon-app", "crates/xtask"]

[workspace.package]
version = "0.53.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "A fast, local photo manager for Linux, macOS and Windows."
repository = "https://github.com/bsg62/photon"
authors = ["David Henning"]

# tract unoptimised runs one face detection in about five seconds, against one with these:
# measured 2026-10-02 on the test fixture. Only the three crates that hold the arithmetic.
[profile.dev.package.tract-linalg]
opt-level = 3

[profile.dev.package.tract-core]
opt-level = 3

[profile.dev.package.tract-data]
opt-level = 3
