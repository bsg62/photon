name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # A tag-only workflow cannot be tested before the tag that needs it, so changes to this
  # file build and verify on the pull request. The publish job stays tag-only.
  pull_request:
    paths: ['.github/workflows/release.yml', 'crates/photon-app/windows/**']

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Versions agree, and match the tag
        run: |
          cargo run -p xtask -- versions --tag "${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}"
          cargo run -p xtask -- metadata

  linux:
    needs: version-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build -- --bundles deb,appimage --ci
      - name: Verify the artifacts
        run: |
          set -euo pipefail
          deb=$(ls target/release/bundle/deb/*.deb)
          app=$(ls target/release/bundle/appimage/*.AppImage)
          test -s "$deb" || { echo "::error::deb is missing or empty"; exit 1; }
          test -s "$app" || { echo "::error::AppImage is missing or empty"; exit 1; }
          test -x "$app" || { echo "::error::AppImage is not executable"; exit 1; }
          echo "deb:      $deb"
          echo "appimage: $app"
          # The dependency check this whole job exists for: a .deb that installs and then
          # fails to start is the classic packaging bug.
          depends=$(dpkg-deb --field "$deb" Depends)
          echo "Depends: $depends"
          for lib in libwebkit2gtk-4.1 libsoup-3.0; do
            echo "$depends" | grep -q "$lib" || { echo "::error::deb does not depend on $lib"; exit 1; }
          done
          dpkg-deb --field "$deb" Description | grep -q . || { echo "::error::deb description is empty"; exit 1; }
          ver=$(node -p "require('./crates/photon-app/tauri.conf.json').version")
          dpkg-deb --field "$deb" Version | grep -q "$ver" \
            || { echo "::error::deb Version does not carry $ver"; exit 1; }
          # The declared Depends is near-tautological on its own: xtask already enforces those
          # strings and the bundler copies them through. Extract the binary and look at what it
          # genuinely links against, so a new transitive .so cannot slip in undeclared.
          dpkg-deb -x "$deb" "$RUNNER_TEMP/debroot"
          # Locate the binary rather than assuming its name: it takes the crate name
          # (photon-app), not productName (photon), and that could change.
          bin_rel=$(dpkg-deb -c "$deb" | awk '{print $NF}' | sed 's|^\./||' | grep -E '^usr/bin/[^/]+$' | head -1) || true
          test -n "$bin_rel" || { echo "::error::the deb contains no file under usr/bin/"; dpkg-deb -c "$deb"; exit 1; }
          bin="$RUNNER_TEMP/debroot/$bin_rel"
          echo "binary inside the deb: $bin_rel"
          test -x "$bin" || { echo "::error::$bin_rel inside the deb is not executable"; exit 1; }
          echo "--- ldd $bin"
          ldd "$bin" || true
          if ldd "$bin" | grep -q "not found"; then
            echo "::error::the packaged binary has unresolved libraries:"
            ldd "$bin" | grep "not found"
            exit 1
          fi
          # The two libraries the .deb declares must be ones the binary actually links.
          for lib in libwebkit2gtk-4.1 libsoup-3.0; do
            ldd "$bin" | grep -q "$lib" || { echo "::error::binary does not link $lib, but the deb declares it"; exit 1; }
          done
          # Spec §5: the embedded desktop entry must name photon, or the app lands in the
          # applications menu under the wrong name — currently only caught by a human, after install.
          ( cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$app" --appimage-extract >/dev/null )
          grep -qi '^Name=.*photon' "$RUNNER_TEMP"/squashfs-root/*.desktop \
            || { echo "::error::the AppImage's desktop entry does not name photon"; exit 1; }
      - uses: actions/upload-artifact@v5
        with:
          name: photon-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  macos:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: photon-macos-aarch64
          - target: x86_64-apple-darwin
            name: photon-macos-x86_64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }} --bundles dmg --ci
      - name: Verify the artifacts
        run: |
          set -euo pipefail
          dmg=$(ls target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          test -s "$dmg" || { echo "::error::dmg is missing or empty"; exit 1; }
          echo "dmg: $dmg"
          ver=$(node -p "require('./crates/photon-app/tauri.conf.json').version")
          case "$dmg" in
            *"$ver"*) ;;
            *) echo "::error::dmg name does not carry version $ver: $dmg"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  windows:
    needs: version-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run tauri build -- --bundles msi --ci
      - name: Verify the artifacts
        shell: bash
        run: |
          set -euo pipefail
          msi=$(ls target/release/bundle/msi/*.msi)
          test -s "$msi" || { echo "::error::msi is missing or empty"; exit 1; }
          echo "msi: $msi"
          ver=$(node -p "require('./crates/photon-app/tauri.conf.json').version")
          case "$msi" in
            *"$ver"*) ;;
            *) echo "::error::msi name does not carry version $ver: $msi"; exit 1 ;;
          esac
      # The installer template is a copy of Tauri's (crates/photon-app/windows/), so a Tauri
      # upgrade or a careless edit could quietly bring back the unasked-for desktop shortcut.
      # Nothing else here builds an MSI, and nobody can click through one in CI, so read the
      # built package's own tables instead.
      - name: The desktop shortcut is opt-in
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $msi = (Get-ChildItem target/release/bundle/msi/*.msi)[0].FullName
          $installer = New-Object -ComObject WindowsInstaller.Installer
          $db = $installer.GetType().InvokeMember('OpenDatabase', 'InvokeMethod', $null, $installer, @($msi, 0))
          function Rows([string]$sql, [int]$columns) {
            $view = $db.GetType().InvokeMember('OpenView', 'InvokeMethod', $null, $db, @($sql))
            [void]$view.GetType().InvokeMember('Execute', 'InvokeMethod', $null, $view, $null)
            $out = @()
            while ($rec = $view.GetType().InvokeMember('Fetch', 'InvokeMethod', $null, $view, $null)) {
              $out += ,@(1..$columns | ForEach-Object { $rec.GetType().InvokeMember('StringData', 'GetProperty', $null, $rec, @($_)) })
            }
            [void]$view.GetType().InvokeMember('Close', 'InvokeMethod', $null, $view, $null)
            return ,$out
          }
          $failed = $false
          function Expect([string]$what, $actual, $expected) {
            if ("$actual" -ne "$expected") {
              Write-Output "::error::$what is '$actual', expected '$expected'"
              $script:failed = $true
            } else { Write-Output "ok: $what = '$actual'" }
          }
          $cond = Rows "SELECT ``Condition`` FROM ``Component`` WHERE ``Component`` = 'ApplicationShortcutDesktop'" 1
          Expect 'the desktop shortcut component condition' $cond[0][0] 'DESKTOPSHORTCUT'
          $box = Rows "SELECT ``Type``, ``Property`` FROM ``Control`` WHERE ``Dialog_`` = 'PhotonInstallDirDlg' AND ``Control`` = 'DesktopShortcut'" 2
          Expect 'the checkbox control' ($box[0] -join ',') 'CheckBox,DESKTOPSHORTCUT'
          $default = Rows "SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'DESKTOPSHORTCUT'" 1
          Expect 'rows giving DESKTOPSHORTCUT a default' $default.Count 0
          $secure = Rows "SELECT ``Value`` FROM ``Property`` WHERE ``Property`` = 'SecureCustomProperties'" 1
          Expect 'DESKTOPSHORTCUT on the secure list' (($secure[0][0] -split ';') -contains 'DESKTOPSHORTCUT') 'True'
          $next = Rows "SELECT ``Argument`` FROM ``ControlEvent`` WHERE ``Dialog_`` = 'LicenseAgreementDlg' AND ``Control_`` = 'Next' AND ``Event`` = 'NewDialog'" 1
          Expect 'the page after the licence' $next[0][0] 'PhotonInstallDirDlg'
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v5
        with:
          name: photon-windows
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    # Tag pushes only: a pull request, or a workflow_dispatch rehearsal (including one run
    # against a tag ref), builds and verifies, but publishes nothing.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd artifacts
          # The Linux job uploads two globs from different directories, so its artifact keeps
          # them under `deb/` and `appimage/`, while the single-glob macOS and Windows
          # artifacts arrive flat. Flatten before going further: `sha256sum` and
          # `gh release create` both take files, and choke on a directory.
          find . -mindepth 2 -type f -exec mv -t . {} +
          find . -mindepth 1 -type d -delete
          ls -la
          # Publishing an incomplete release is worse than publishing late, and unlike a
          # draft it cannot be quietly corrected once people have the link.
          for ext in deb AppImage msi; do
            ls ./*."$ext" >/dev/null || { echo "::error::no .$ext artifact to publish"; exit 1; }
          done
          test "$(ls ./*.dmg | wc -l)" -eq 2 \
            || { echo "::error::expected two .dmg artifacts, one per macOS architecture"; exit 1; }
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # `--generate-notes` has GitHub list the pull requests merged since the previous
          # tag. The API prepends an explicit `--notes` body to the generated section and an
          # explicit `--title` wins over the generated one, so the security warning still
          # comes first and the release is still called "photon vX.Y.Z".
          gh release create "$TAG" \
            --draft \
            --generate-notes \
            --title "photon $TAG" \
            --notes "Unsigned installers. See the README for the security warnings each OS shows, and how to get past them." \
            artifacts/*
