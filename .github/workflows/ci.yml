name: ci

on:
  push:
    # `native-ui` as well as `main`: a pull request reads the caches of the branch it is
    # into, and one into `native-ui` otherwise starts from `main`'s, which holds none of
    # the egui and wgpu stack - a cold build of it on every first run (27 minutes on
    # Windows, measured 2026-10-09).
    branches: [main, native-ui]
  pull_request:

# A push to a pull request makes the run for the commit before it pointless, and the
# Windows runner is the slowest to come free. A push to `main` or `native-ui` is a group of
# its own (the run's id), so it is neither cancelled nor, waiting, replaced by the next:
# each commit there should have its own answer.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # No debug info in CI's builds. It is most of what a cache holds and most of what the
  # linker writes, and linking is where Windows loses to Linux (a warm run there took
  # about twice as long). The price: a panic's backtrace in CI has no line numbers; the
  # panic's own message, which names file and line, is unchanged.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev
      # libjpeg-turbo's x86 SIMD code is nasm assembly. Without nasm, mozjpeg-sys builds plain
      # C instead, silently, so the next step fails by name if nasm is missing. rav1d's x86-64
      # assembly (`avif-asm`) needs it too, and would fail the build without it anyway.
      - name: Install nasm
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y nasm ;;
            macOS)   brew install nasm ;;
            Windows) choco install nasm -y --no-progress && echo 'C:\Program Files\NASM' >> "$GITHUB_PATH" ;;
          esac
      - name: nasm is on the PATH
        run: nasm -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Saved from `main` and `native-ui` only; a pull request restores and does not save.
      # The repository's caches are capped at 10 GB together, and three platforms at one to
      # two GB each for every open pull request evicted the branches' own: `main`'s Linux
      # and macOS caches were gone on 2026-10-09 and those jobs took twenty minutes for
      # five. Not saving also spares a pull request the save itself, five minutes on Windows.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/native-ui' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # rav1d's x86-64 assembly (`avif-asm`) is off above, as in a local build without nasm,
      # and on in every x86-64 installer the release workflow builds: this runs photon-core's
      # tests through it. The macOS runners are arm64, where it does not build (photon-core's
      # Cargo.toml), so there it is only built, for the x86-64 dmg release.yml cross-compiles.
      - if: runner.os != 'macOS'
        run: cargo test -p photon-core --features avif-asm
      - if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          cargo build -p photon-core --features avif-asm --target x86_64-apple-darwin
      # Reads the three real version files (xtask's unit tests only cover string literals),
      # so drift fails on the pull request rather than after a release tag already exists.
      - if: runner.os == 'Linux'
        run: |
          cargo run -p xtask -- versions
          cargo run -p xtask -- metadata
      # That the benchmark still compiles. Its code is the same on every platform, and a
      # release build of photon-core and everything under it is a minute and a half on
      # Windows and a large part of each platform's cache: one platform is enough.
      - if: runner.os == 'Linux'
        run: cargo bench -p photon-core --bench grid --no-run

  # Builds the release path (frontend embedded, `tauri::is_dev()` false), which the debug
  # builds above never exercise. Ubuntu only and unbundled: installers are built by
  # release.yml, which runs on tags rather than on every pull request.
  release-build:
    name: release build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/native-ui' }}
      - run: npm ci
      - run: npm run -w ui build
      - run: npm run tauri build -- --no-bundle

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run -w ui build
