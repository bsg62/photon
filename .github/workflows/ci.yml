name: ci

on:
  push:
    # `native-ui` as well as `main`: a pull request reads the caches of the branch it is
    # into, and one into `native-ui` otherwise starts from `main`'s, which holds none of
    # the egui and wgpu stack - a cold build of it on every first run (27 minutes on
    # Windows, measured 2026-10-09).
    branches: [main, native-ui]
  pull_request:

# A push to a pull request makes the run for the commit before it pointless, and the
# Windows runner is the slowest to come free. A push to `main` or `native-ui` is a group of
# its own (the run's id), so it is neither cancelled nor, waiting, replaced by the next:
# each commit there should have its own answer.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  # No debug info in CI's builds. It is most of what a cache holds and most of what the
  # linker writes, and linking is where Windows loses to Linux (a warm run there took
  # about twice as long). The price: a panic's backtrace in CI has no line numbers; the
  # panic's own message, which names file and line, is unchanged.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # The Windows runner's C: drive, where TEMP is, is several times slower at making and
      # removing small files than D:, where the checkout and the build are - and the native
      # window's tests build libraries of thousands of cached thumbnails in temporary
      # directories. Measured 2026-10-14 on one test of 18,000 photos: 155 s with TEMP on C:,
      # 23 s on D:; the whole of `tests/dialogs.rs` 52 s and 14 s.
      - name: Temporary files on the D drive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force D:\tmp | Out-Null
          "TEMP=D:\tmp" >> $env:GITHUB_ENV
          "TMP=D:\tmp" >> $env:GITHUB_ENV
      # The window plays a video through GStreamer: its development files to link
      # against, and the plugins that read an MP4 and decode H.264 and HEVC, which
      # `tests/video` needs - without them every test there passes over itself.
      - name: Install GStreamer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
      # libjpeg-turbo's x86 SIMD code is nasm assembly. Without nasm, mozjpeg-sys builds plain
      # C instead, silently, so the next step fails by name if nasm is missing. rav1d's x86-64
      # assembly (`avif-asm`) needs it too, and would fail the build without it anyway.
      - name: Install nasm
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update && sudo apt-get install -y nasm ;;
            macOS)   brew install nasm ;;
            Windows) choco install nasm -y --no-progress && echo 'C:\Program Files\NASM' >> "$GITHUB_PATH" ;;
          esac
      - name: nasm is on the PATH
        run: nasm -v
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # Saved from `main` and `native-ui` only; a pull request restores and does not save.
      # The repository's caches are capped at 10 GB together, and three platforms at one to
      # two GB each for every open pull request evicted the branches' own: `main`'s Linux
      # and macOS caches were gone on 2026-10-09 and those jobs took twenty minutes for
      # five. Not saving also spares a pull request the save itself, five minutes on Windows.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/native-ui' }}
      # THROWAWAY: the star-key flake probe. Never to be merged.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - run: cargo nextest run -p photon-ui --test all --no-run
      - name: Stress the star-key test, three loops at once
        shell: bash
        run: |
          T=menu::the_star_key_takes_several_photos_the_way_of_the_deciding_one
          for w in 1 2 3; do
            ( cargo nextest run --color never -p photon-ui --test all "$T" --stress-count 60 > "loop$w.log" 2>&1; echo "loop $w exit $?" >> "loop$w.log" ) &
          done
          wait
          failed=0
          for w in 1 2 3; do
            echo "=== loop $w: $(grep -E "Summary|exit" "loop$w.log" | tr '\n' ' ')"
            if ! grep -q "exit 0" "loop$w.log"; then
              failed=1
              grep -vE "^\s+PASS" "loop$w.log"
            fi
          done
          exit $failed
