name: pages

# Publishes site/ to photon.webcodr.io: on a change to the site, and when a release is
# published, so the front page names the latest release's version (written in on deploy;
# site/ holds no version, which would go stale).
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # A release's run stands on its tag, and the github-pages environment deploys from main
  # alone, so the release asks for a run on main instead. workflow_dispatch is one of the
  # two events GITHUB_TOKEN may start a run with.
  redeploy:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      # Each `<!--release: …-->` comment becomes its text with {version}, {date} and {url}
      # filled in from the latest published release (`gh release view` passes over drafts
      # and pre-releases), and the JSON-LD gains its "softwareVersion" and "datePublished" (an HTML comment is
      # no comment inside a script). A page that lost either fails the deploy rather than
      # quietly showing no version.
      - name: Write in the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --repo "$GITHUB_REPOSITORY" --json tagName,publishedAt,url > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" site/index.html <<'PY'
          import datetime, html, json, re, sys
          release = json.load(open(sys.argv[1]))
          published = datetime.datetime.fromisoformat(release["publishedAt"].replace("Z", "+00:00"))
          fields = {
              "version": html.escape(release["tagName"].removeprefix("v")),
              "date": f"{published.day} {published:%B %Y}",
              "url": html.escape(release["url"]),
          }
          page = sys.argv[2]
          text, count = re.subn(
              r"<!--release: (.*?)-->",
              lambda m: m.group(1).format(**fields),
              open(page, encoding="utf-8").read(),
              flags=re.S,
          )
          if count == 0:
              sys.exit(f"{page} has no <!--release: --> comment")
          def versioned(m):
              data = json.loads(m.group(2))
              data["softwareVersion"] = release["tagName"].removeprefix("v")
              data["datePublished"] = published.date().isoformat()
              return m.group(1) + "\n" + json.dumps(data, indent=2, ensure_ascii=False) + "\n" + m.group(3)
          text, scripts = re.subn(
              r'(<script type="application/ld\+json">)(.*?)(</script>)', versioned, text, flags=re.S
          )
          if scripts != 1:
              sys.exit(f"{page} has {scripts} JSON-LD scripts, not one")
          open(page, "w", encoding="utf-8").write(text)
          print(f"{page}: {count} written in for {fields['version']}")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
