[package]
name = "photon-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true

# The installed executable is `photon`, not the crate name. Tauri's `mainBinaryName` names
# the binary it bundles, and the bundler looks for a built binary of that name - so the two
# have to agree. `cargo run -p photon-app` and `cargo test -p photon-app` are unaffected:
# the *package* is still photon-app.
[[bin]]
name = "photon"
path = "src/main.rs"

[features]
# Enabled by `tauri build`. Without it `tauri::is_dev()` is true, so a plain
# `cargo build --release` produces a binary that embeds no frontend and tries to load the
# dev server instead: a blank window with no error.
custom-protocol = ["tauri/custom-protocol"]
# rav1d's assembly for AVIF, x86-64 targets only (photon-core's `avif-asm` says why, and
# why it is opt-in). The release workflow builds every x86-64 installer with it.
avif-asm = ["photon-core/avif-asm"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
photon-core = { path = "../photon-core" }
dunce = "1.0.5"
parking_lot = "0.12.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tauri-plugin-window-state = "2.4.1"
tauri-plugin-clipboard-manager = "2.3.3"
tiny_http = "0.12"
getrandom = "0.3"
# Tauri's own runtime, named for its timer: the protocol handler bounds a thumbnail wait with
# `tokio::time::timeout`, and the face crops with a `tokio::sync::Semaphore`. Tauri builds
# that runtime with every driver its features enable.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# Settings' memory figure (`memory.rs`): the page size on Linux, the physical footprint on
# macOS; the process table and private working set on Windows.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
] }

[dev-dependencies]
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# Only to break a library on purpose: a rebuild that fails is the one thing a rollback test
# cannot get from the engine's own API. The same version and features photon-core builds.
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
# `tauri::test`'s mock runtime: the one way to send a command through the real
# `#[tauri::command]` dispatch, which is where a blocking command occupies an async worker.
tauri = { version = "2.11.5", features = ["test"] }
