[package]
name = "photon-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
dunce = "1.0.5"
fast_image_resize = { version = "6.1.0", features = ["image"] }
foldhash = "0.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
jiff = "0.2.35"
kamadak-exif = "0.6.1"
libc = "0.2"
memchr = "2.8.3"
# libjpeg-turbo, as the mozjpeg fork vendors it, for the scaled decode of a JPEG's preview
# (`turbo.rs`). Default features on purpose, for `nasm_simd`, which builds the x86 SIMD code
# wherever nasm is installed (the CI and release workflows make sure of it). `mozjpeg` asks
# `mozjpeg-sys` for `unwinding` (`-fexceptions`, where the C compiler has it) whatever the
# features here say. What would break `turbo`'s error manager, which hands a file back by
# unwinding out of libjpeg, is `panic = "abort"`: `turbo.rs` refuses to compile under it.
mozjpeg = "0.10.13"
# The C declarations `turbo`'s error manager is built from; `mozjpeg` does not re-export them.
mozjpeg-sys = "2.2.3"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
parking_lot = "0.12.5"
quick-xml = "0.42"
rav1d = { version = "1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
tracing = "0.1.44"
walkdir = "2.5.0"
webp = "0.3.1"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zenavif-parse = "0.6.2"

[features]
# rav1d's hand-written assembly (dav1d's), which decodes a 12 MP AVIF's thumbnail in 226 ms
# where its Rust takes 521, measured on x86-64. AV1 decoding is bit-exact, so it changes how
# fast a photo decodes, never what it decodes to.
#
# For x86-64 targets only: rav1d 1.1.0's published package lacks `src/arm/asm-offsets.h`, so
# its arm64 assembly does not build, and turning this on for an arm64 target fails there.
# (A feature cannot be limited to a target, and Cargo refuses the same crate declared under a
# second name for one, so the release workflow passes it only for x86-64 targets.)
#
# Opt-in because the x86 assembly needs nasm, and unlike mozjpeg-sys, rav1d fails to build
# without it rather than falling back to plain code: a local build with no nasm keeps working.
avif-asm = ["rav1d/asm"]

[dev-dependencies]
criterion = "0.8.2"
# Test fixtures only (a progressive and a CMYK JPEG, `turbo.rs`), which libjpeg-turbo's
# compressor as `turbo::encode` drives it does not write.
jpeg-encoder = "0.7.1"
serde_json = "1"

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "render"
harness = false
