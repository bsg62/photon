[package]
name = "photon-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
# The tests of the whole application are one binary (`tests/main.rs`), not one for each
# file in `tests/`: each binary links all of egui, wgpu and the engine, which twenty-five
# times over was most of a Windows build, and one binary's tests share one pool of threads
# where twenty-five ran one after another, each ending on its slowest few.
autotests = false

# `photon` is photon-app's binary until the switch-over; this one is named apart so both
# can be built side by side.
[[bin]]
name = "photon-native"
path = "src/main.rs"

[[test]]
name = "all"
path = "tests/main.rs"

# The system's video backends, on the main thread: AVFoundation's player wants it, and
# libtest's harness runs every test on a thread of its own (`tests/video/main.rs`).
[[test]]
name = "video"
path = "tests/video/main.rs"
harness = false

[dependencies]
photon-core = { path = "../photon-core" }
photon-engine = { path = "../photon-engine" }
# Pinned to the patch: egui changes behaviour, and its API, between releases. This is the
# version `pch/rawmakase` ships on the same three platforms.
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
# egui's SVG loader, for the icons.
egui_extras = { version = "=0.36.2", default-features = false, features = ["svg"] }
# The platform's interface face, and an installed face for every script it lacks. MIT. Not
# on crates.io, so pinned to a tag; without its `inter` feature it bundles no font.
fastframe-fonts = { git = "https://github.com/crmne/fastframe", tag = "v0.4.1", default-features = false }
# The runs of a line that mixes right-to-left and left-to-right text (`text.rs`).
unicode-bidi = "0.3.18"
# The data and cache directories, through the crate Tauri resolves them with.
dirs = "6.0.0"
# The viewer's time zone, for the month a folder's header names. photon-core's version.
jiff = "0.2.35"
parking_lot = "0.12.5"
# What kind of window this is, to know whether a dropped folder can arrive in it: the
# crate eframe hands its window out through, at eframe's own version.
raw-window-handle = "0.6.2"
# The gate's report (`probe.rs`), in the shape the Svelte probe writes its own.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# A video's poster encoded for the engine (`posters.rs`), and the tests' pictures read
# back. photon-core's version.
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
# The People page's crops, which the engine cuts as WebP for the route that serves them
# (`ThumbCache::face_crop`), decoded by the library that encoded them: photon-core's,
# vendored and compiled in already.
webp = "0.3.1"

# Windows' setting of how many lines a notch of the mouse wheel scrolls (`wheel.rs`): the
# bindings winit already brings, at its version. Declarations only; the call is the
# system's own `user32`.
# The system's folder picker and message box (`platform.rs`) on Windows and macOS: the
# crate Tauri's dialog plugin is built on, at its version. Not on Linux, where it must be
# built with GTK or the portal and refuses both at once - and Tauri's plugin asks for GTK
# in a build of the whole workspace.
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
rfd = { version = "0.16.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
# Video (`video/mf.rs`): Media Foundation, part of the system. The version already in the
# lockfile, which wgpu brings.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Media_MediaFoundation",
    "Win32_Graphics_Imaging",
] }
windows-core = "0.62.2"

# Video (`video/gst.rs`): GStreamer, which the web view's photon already needs to start.
# Its libraries are linked (the core, and plugins-base's app and video); its plugins are
# looked for when a video is opened.
[target.'cfg(target_os = "linux")'.dependencies]
# The folder picker on Linux (`platform.rs`): the XDG desktop portal over D-Bus, through
# the client rfd itself uses there - pure Rust, no GTK. `async-std` is the executor it
# runs on outside a runtime of its own (with tokio, its default, zbus panics with none
# running); a request is waited for with eframe's `pollster`.
ashpd = { version = "0.11.1", default-features = false, features = ["async-std"] }
pollster = "1.0.1"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"

# Video (`video/avf.rs`): AVFoundation, part of the system. Every framework crate turns on
# all its features by default but this one's CoreMedia half, which its timing needs.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["objc2-core-media"] }
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-quartz-core = "0.3.2"
# A seek's completion handler (`video/avf.rs`). objc2-av-foundation's version.
block2 = "0.6.2"

[dev-dependencies]
# Whole frames of the application without a window (`eframe`), and off-screen rendering
# for `tests/screenshots.rs` (`wgpu`).
egui_kittest = { version = "=0.36.2", features = ["wgpu", "eframe"] }
tempfile = "3.27.0"
# A second connection to a test's library, to hold its write lock (`tests/sort.rs`).
rusqlite = { version = "0.40.2", features = ["bundled"] }
# The harness of `tests/video`, which runs its tests on the main thread. MIT or Apache 2.0.
libtest-mimic = "0.8.2"
